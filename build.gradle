// Top-level build file — shared config for all modules.
buildscript {
    ext {
        // Compose BOM aligned with the Kotlin 2.4.x Compose compiler.
        compose_bom_version = '2026.08.00'
    }
}

plugins {
    id 'com.android.application' version '9.4.0' apply false
    // AGP 9.0+ has built-in Kotlin — the kotlin.android plugin is gone. The
    // Compose compiler plugin is still applied separately; its version drives the
    // Kotlin Gradle Plugin version (>= 2.0.20 to consume MMD-android 1.0.2).
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
    // Plain Kotlin/JVM plugin for the :core game-logic module (no Android).
    id 'org.jetbrains.kotlin.jvm' version '2.4.10' apply false
}
